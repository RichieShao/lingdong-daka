<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <title>灵动打卡 · 学习激励小助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 内联 SVG 图标库（Lucide 风格线性图标） -->
    <svg style="display:none" aria-hidden="true">
      <defs>
        <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
        <symbol id="icon-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></symbol>
        <symbol id="icon-list-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6h9M11 12h9M11 18h9"/><path d="M5 7l2 2 4-4M5 13l2 2 4-4M5 19l2 2 4-4"/></symbol>
        <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></symbol>
        <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
        <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
        <symbol id="icon-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
        <symbol id="icon-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
        <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
        <symbol id="icon-gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5" rx="1"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7a4 4 0 0 0-4-4C5.5 3 5 6 5 6s2.5 0 4 .5c.5.13 1.5.5 2 1.5h.5c.5-1 1.5-1.37 2-1.5 1.5-.5 4-.5 4-.5s-.5-3-3-3a4 4 0 0 0-4 4z"/></symbol>
        <symbol id="icon-book-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
        <symbol id="icon-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></symbol>
        <symbol id="icon-arrow-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="5 12 12 19 19 12"/></symbol>
        <symbol id="icon-coffee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h18v4a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
        <symbol id="icon-ticket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v2a2 2 0 0 1 0 4v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2a2 2 0 0 1 0-4V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/><line x1="15" y1="5" x2="15" y2="19"/></symbol>
        <symbol id="icon-cookie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="8" cy="10" r="1.5" fill="currentColor" stroke="none"/><circle cx="15" cy="8" r="1.5" fill="currentColor" stroke="none"/><circle cx="14" cy="15" r="1.5" fill="currentColor" stroke="none"/><circle cx="9" cy="16" r="1.5" fill="currentColor" stroke="none"/></symbol>
        <symbol id="icon-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
        <symbol id="icon-calculator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="16" y2="18"/></symbol>
        <symbol id="icon-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
        <symbol id="icon-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></symbol>
        <symbol id="icon-kanban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="12" y1="4" x2="12" y2="20"/><rect x="5.5" y="7" width="4.5" height="2.6" rx="1"/><rect x="5.5" y="11" width="4.5" height="2.6" rx="1"/><rect x="14" y="7" width="4.5" height="2.6" rx="1"/><rect x="14" y="11" width="4.5" height="2.6" rx="1"/></symbol>
      </defs>
    </svg>

    <!-- 顶部栏 -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-logo">灵</span>
        <span class="brand-name">灵动打卡</span>
      </div>
      <div class="points-pill" id="pointsPill" title="积分余额">
        <svg class="ico ico-star" aria-hidden="true"><use href="#icon-star"/></svg><span id="pointsBalance">0</span>
      </div>
    </header>

    <!-- 视图区 -->
    <main class="views">
      <!-- 首页 -->
      <section class="view view-home active" id="view-home">
        <!-- 走马灯 -->
        <div class="marquee card-glass" id="marquee">
          <div class="marquee-head">
            <span class="marquee-subject" id="marqueeSubject">语文</span>
            <span class="marquee-tag" id="marqueeType">名言</span>
          </div>
          <div class="marquee-viewport">
            <div class="marquee-track" id="marqueeTrack"></div>
          </div>
          <div class="marquee-ctrl">
            <button class="marq-btn" id="marqPrev" aria-label="上一条">‹</button>
            <div class="marquee-dots" id="marqueeDots"></div>
            <button class="marq-btn" id="marqNext" aria-label="下一条">›</button>
          </div>
        </div>

        <!-- 今日概览 -->
        <div class="home-stats" id="homeStats"></div>

        <!-- 今日待打卡 -->
        <div class="block">
          <div class="block-title">今日待打卡</div>
          <div class="subject-grid" id="homeSubjects"></div>
        </div>

        <!-- 近期任务 -->
        <div class="block">
          <div class="block-title">近期任务</div>
          <div class="task-list" id="homeTasks"></div>
        </div>

        <!-- 最新积分 -->
        <div class="block">
          <div class="block-title">最新积分</div>
          <div class="flow-list" id="homeFlows"></div>
        </div>
      </section>

      <!-- 打卡 -->
      <section class="view" id="view-checkin">
        <div class="block">
          <div class="block-title">选择科目打卡</div>
          <div class="subject-grid" id="checkinSubjects"></div>
        </div>
        <div class="block">
          <div class="block-head">
            <div class="block-title">今日打卡记录</div>
            <span class="block-hint" id="todayCount">0 次</span>
          </div>
          <div class="checkin-list" id="checkinToday"></div>
        </div>
      </section>

      <!-- 任务 -->
      <section class="view" id="view-tasks">
        <div class="block">
          <div class="block-head">
            <div class="block-title">学习科目</div>
            <button class="mini-btn" id="addSubjectBtn">＋ 科目</button>
          </div>
          <div class="subject-manage" id="subjectManage"></div>
        </div>
        <div class="block">
          <div class="block-head">
            <div class="block-title">学习任务</div>
            <select class="mini-select" id="taskFilter"></select>
          </div>
          <div class="task-list" id="taskList"></div>
        </div>
      </section>

      <!-- 倒数日 -->
      <section class="view" id="view-countdown">
        <div class="block">
          <div class="block-head">
            <div class="block-title">倒数日</div>
            <button class="mini-btn" id="addCountdownBtn">＋ 新增</button>
          </div>
          <div class="countdown-list" id="countdownList"></div>
        </div>
      </section>

      <!-- 我的 -->
      <section class="view" id="view-me">
        <div class="block">
          <div class="block-head">
            <div class="block-title"><svg class="ico block-title-ico" aria-hidden="true"><use href="#icon-gift"/></svg>积分兑换</div>
            <button class="mini-btn" id="addGiftBtn">＋ 礼品</button>
          </div>
          <div class="gift-list" id="giftList"></div>
        </div>
        <div class="block">
          <div class="block-head">
            <div class="block-title">打卡历史</div>
            <select class="mini-select" id="historyFilter"></select>
          </div>
          <div class="history-list" id="historyList"></div>
        </div>
        <div class="block">
          <div class="block-title">积分流水</div>
          <div class="flow-list" id="flowList"></div>
        </div>
        <div class="block">
          <button class="danger-btn" id="resetBtn">清空所有数据</button>
        </div>
      </section>

      <!-- 番茄钟（专注） -->
      <section class="view" id="view-focus">
        <div class="focus-wrap">
          <div class="focus-modes">
            <button class="mode-btn active" data-mode="focus"><svg class="ico" aria-hidden="true"><use href="#icon-clock"/></svg>专注</button>
            <button class="mode-btn" data-mode="short"><svg class="ico" aria-hidden="true"><use href="#icon-coffee"/></svg>短休</button>
            <button class="mode-btn" data-mode="long"><svg class="ico" aria-hidden="true"><use href="#icon-moon"/></svg>长休</button>
          </div>
          <div class="focus-ring">
            <svg viewBox="0 0 220 220" aria-hidden="true">
              <defs>
                <linearGradient id="fgGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#6366f1"/>
                  <stop offset="100%" stop-color="#22d3ee"/>
                </linearGradient>
              </defs>
              <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
              <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="100" stroke="url(#fgGrad)"></circle>
            </svg>
            <div class="focus-center">
              <div class="focus-emoji" id="focusEmoji"><svg class="ico focus-big-ico" aria-hidden="true"><use href="#icon-clock"/></svg></div>
              <div class="focus-time" id="focusTime">25:00</div>
              <div class="focus-tip" id="focusTip">开始专注吧～</div>
            </div>
          </div>
          <div class="focus-ctrl">
            <button class="focus-btn ghost" id="focusReset" aria-label="重置">↺</button>
            <button class="focus-btn primary" id="focusToggle">开始</button>
          </div>
          <div class="focus-stats">
            <div class="fstat"><svg class="ico fstat-ico" aria-hidden="true"><use href="#icon-clock"/></svg><b id="focusToday">0</b><small>今日</small></div>
            <div class="fstat"><svg class="ico fstat-ico" aria-hidden="true"><use href="#icon-trophy"/></svg><b id="focusTotal">0</b><small>累计</small></div>
          </div>
        </div>
      </section>
    </main>

    <!-- 悬浮按钮 -->
    <button class="fab" id="fab" aria-label="快捷操作"><svg class="ico fab-ico" aria-hidden="true"><use href="#icon-plus"/></svg></button>

    <!-- 底部导航 -->
    <nav class="bottom-nav" id="bottomNav">
      <span class="nav-glow" aria-hidden="true"></span>
      <span class="nav-sheen" aria-hidden="true"></span>
      <button class="nav-btn active" data-view="home"><svg class="nav-ico" aria-hidden="true"><use href="#icon-home"/></svg><span>首页</span></button>
      <button class="nav-btn" data-view="checkin"><svg class="nav-ico" aria-hidden="true"><use href="#icon-check-circle"/></svg><span>打卡</span></button>
      <button class="nav-btn" data-view="tasks"><svg class="nav-ico" aria-hidden="true"><use href="#icon-kanban"/></svg><span>任务</span></button>
      <button class="nav-btn" data-view="countdown"><svg class="nav-ico" aria-hidden="true"><use href="#icon-calendar"/></svg><span>倒数</span></button>
      <button class="nav-btn" data-view="focus"><svg class="nav-ico" aria-hidden="true"><use href="#icon-clock"/></svg><span>专注</span></button>
      <button class="nav-btn" data-view="me"><svg class="nav-ico" aria-hidden="true"><use href="#icon-user"/></svg><span>我的</span></button>
    </nav>

    <!-- 底部弹层 -->
    <div class="sheet-mask" id="sheetMask">
      <div class="sheet" id="sheet" role="dialog" aria-modal="true">
        <div class="sheet-head">
          <div class="sheet-title" id="sheetTitle">标题</div>
          <button class="sheet-close" id="sheetClose" aria-label="关闭"><svg class="ico" aria-hidden="true"><use href="#icon-x"/></svg></button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <!-- 确认弹层 -->
    <div class="modal-mask" id="confirmMask">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-title" id="confirmTitle">提示</div>
        <div class="modal-msg" id="confirmMsg"></div>
        <div class="modal-actions">
          <button class="modal-btn ghost" id="confirmCancel">取消</button>
          <button class="modal-btn danger" id="confirmOk">确定</button>
        </div>
      </div>
    </div>

    <!-- 轻提示 -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
