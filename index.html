<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <title>灵动打卡 · 学习激励小助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 内联 SVG 图标库（HarmonyOS / iOS 风格填充图标） -->
    <svg style="display:none" aria-hidden="true">
      <defs>
        <symbol id="icon-home" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M12 3 3 10.3a.8.8 0 0 0 .55 1.37H5v8.3A1.4 1.4 0 0 0 6.4 22h11.2a1.4 1.4 0 0 0 1.4-1.4v-8.3h1.45a.8.8 0 0 0 .55-1.37ZM10 14.2v5.8h4v-5.8Z"/></symbol>
        <symbol id="icon-check-circle" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.4 14.3-4.2-4.2 1.5-1.5 2.7 2.7 5.9-5.9 1.5 1.5Z"/></symbol>
        <symbol id="icon-list-check" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h3v3H4Zm0 5h3v3H4Zm0 5h3v3H4Zm9-11h7v1.6h-7Zm0 5h7v1.6h-7Zm0 5h7v1.6h-7Z"/></symbol>
        <symbol id="icon-calendar" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M5 4.5A1.5 1.5 0 0 0 3.5 6v12A1.5 1.5 0 0 0 5 19.5h14a1.5 1.5 0 0 0 1.5-1.5V6A1.5 1.5 0 0 0 19 4.5Zm2-1.3a1 1 0 0 1 2 0v2.2a1 1 0 0 1-2 0Zm8 0a1 1 0 0 1 2 0v2.2a1 1 0 0 1-2 0ZM6.5 10h11v6.5h-11Z"/></symbol>
        <symbol id="icon-clock" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm.5 4.5v5.4l3.6 2.1a1 1 0 1 1-1 1.7L11.5 13a1 1 0 0 1-.5-1V6.5a1 1 0 0 1 1 0Z"/></symbol>
        <symbol id="icon-user" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4Z"/></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24" fill="currentColor"><path d="M10.5 5h3v5.5h5.5v3h-5.5v5.5h-3v-5.5H5v-3h5.5Z"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 6.7a1.3 1.3 0 0 1 0 1.8l-9 9.3a1.3 1.3 0 0 1-1.9 0l-4.6-4.7a1.3 1.3 0 1 1 1.9-1.8l3.7 3.8 8.1-8.4a1.3 1.3 0 0 1 1.8 0Z"/></symbol>
        <symbol id="icon-star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.3l6.5-.9Z"/></symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M9 2.5h6a1 1 0 0 1 1 1V4h3.5a1 1 0 0 1 0 2H17v11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V6H4.5a1 1 0 0 1 0-2H8V3.5a1 1 0 0 1 1-1Zm1 7h1.4v8H10Zm2.6 0h1.4v8h-1.4Z"/></symbol>
        <symbol id="icon-pencil" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3.5a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8L9 19.5l-5.5 1.1 1.1-5.5Z"/></symbol>
        <symbol id="icon-x" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 4 12 9.7 17.7 4a1 1 0 0 1 1.4 1.4L13.4 11 19.1 16.7a1 1 0 0 1-1.4 1.4L12 12.4 6.3 18.1a1 1 0 0 1-1.4-1.4L10.6 11 5.9 5.4A1 1 0 0 1 6.3 4Z"/></symbol>
        <symbol id="icon-gift" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5a2.5 2.5 0 0 0-2.5 2.5c0 .4.1.8.3 1.1A2.5 2.5 0 0 0 7 5.5h0a2.5 2.5 0 0 0 .2 1H4.5A1.5 1.5 0 0 0 3 8v2.5h18V8a1.5 1.5 0 0 0-1.5-2.5H16.8a2.5 2.5 0 0 0 .2-1 2.5 2.5 0 0 0-5 0c0 .4.1.8.3 1.1A2.5 2.5 0 0 0 12 2.5ZM3 12.5h8V21H4.5A1.5 1.5 0 0 1 3 19.5Zm10 0h8V19.5a1.5 1.5 0 0 1-1.5 1.5H13Z"/></symbol>
        <symbol id="icon-book-open" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5.5C9.8 4 6.5 3.6 3.5 4v13c3-.4 6.3 0 8.5 1.5V5.5Zm0 0C14.2 4 17.5 3.6 20.5 4v13c-3-.4-6.3 0-8.5 1.5Z"/></symbol>
        <symbol id="icon-arrow-up" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4a1.2 1.2 0 0 1 .8.4l7 7a1.2 1.2 0 0 1-1.7 1.7L13 8.4V20a1.2 1.2 0 0 1-2.4 0V8.4L5.9 13.1A1.2 1.2 0 0 1 4.2 11.4l7-7A1.2 1.2 0 0 1 12 4Z"/></symbol>
        <symbol id="icon-arrow-down" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20a1.2 1.2 0 0 1-.8-.4l-7-7a1.2 1.2 0 0 1 1.7-1.7L11 15.6V4a1.2 1.2 0 0 1 2.4 0v11.6l6.1-5.7a1.2 1.2 0 0 1 1.7 1.7l-7 7A1.2 1.2 0 0 1 12 20Z"/></symbol>
        <symbol id="icon-coffee" viewBox="0 0 24 24" fill="currentColor"><path d="M6 8a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v5.5a4 4 0 0 1-4 4h-3a4 4 0 0 1-4-4Zm10 1.5h2.2a2 2 0 0 1 0 4H16ZM4 17.5h15a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2Z"/></symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2.5a8 8 0 1 0 8.5 8.5 6.5 6.5 0 0 1-8.5-8.5Z"/></symbol>
        <symbol id="icon-ticket" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M3 6.5A2 2 0 0 1 5 4.5h14a2 2 0 0 1 2 2v2.5a2 2 0 0 0 0 4v2.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2.5a2 2 0 0 0 0-4Zm11.1-1.7v14.4"/></symbol>
        <symbol id="icon-cookie" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-3.5 6.5a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8Zm7 0a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8Zm.5 6a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8Zm-6 0a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8Z"/></symbol>
        <symbol id="icon-globe" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-9.2 10h18.4M12 2.3c2.8 2.6 4.4 6.1 4.4 9.7s-1.6 7.1-4.4 9.7c-2.8-2.6-4.4-6.1-4.4-9.7S9.2 4.9 12 2.3Z"/></symbol>
        <symbol id="icon-calculator" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M5 2.5A2 2 0 0 0 3 4.5v15A2 2 0 0 0 5 21.5h14a2 2 0 0 0 2-2v-15a2 2 0 0 0-2-2Zm1 2.5h12v3.4H6Zm.5 5.5h2v2h-2Zm4.5 0h2v2h-2Zm4.5 0h2v2h-2Zm-9 4h2v2h-2Zm4.5 0h2v2h-2Zm4.5 0h2v2h-2Z"/></symbol>
        <symbol id="icon-music" viewBox="0 0 24 24" fill="currentColor"><path d="M18 3.5v9.8a3.2 3.2 0 1 1-2-3V6.1L8 8v8.5a3.2 3.2 0 1 1-2-3V4.5a1 1 0 0 1 .8-.98L17 1.6a1 1 0 0 1 1 1.9Z"/></symbol>
        <symbol id="icon-trophy" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h12v4a6 6 0 0 1-12 0Zm-1.5 1H3a2.3 2.3 0 0 0 0 4.6h1.5Zm16.5-1h-1.5v5.6H21a2.3 2.3 0 0 1 0-4.6ZM10 14.5h4V17h3v2.5H7V17h3Z"/></symbol>
        <symbol id="icon-kanban" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M4 3.5A1.5 1.5 0 0 0 2.5 5v14A1.5 1.5 0 0 0 4 20.5h16a1.5 1.5 0 0 0 1.5-1.5V5A1.5 1.5 0 0 0 20 3.5Zm4.3 3.1h1.4v10.8H8.3Zm6 0h1.4v10.8h-1.4Z"/></symbol>
      </defs>
    </svg>

    <!-- 顶部栏 -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-logo">灵</span>
        <span class="brand-name">灵动打卡</span>
      </div>
      <div class="points-pill" id="pointsPill" title="积分余额">
        <svg class="ico ico-star" aria-hidden="true"><use href="#icon-star"/></svg><span id="pointsBalance">0</span>
      </div>
    </header>

    <!-- 视图区 -->
    <main class="views">
      <!-- 首页 -->
      <section class="view view-home active" id="view-home">
        <!-- 走马灯 -->
        <div class="marquee card-glass" id="marquee">
          <div class="marquee-head">
            <span class="marquee-subject" id="marqueeSubject">语文</span>
            <span class="marquee-tag" id="marqueeType">名言</span>
          </div>
          <div class="marquee-viewport">
            <div class="marquee-track" id="marqueeTrack"></div>
          </div>
          <div class="marquee-ctrl">
            <button class="marq-btn" id="marqPrev" aria-label="上一条">‹</button>
            <div class="marquee-dots" id="marqueeDots"></div>
            <button class="marq-btn" id="marqNext" aria-label="下一条">›</button>
          </div>
        </div>

        <!-- 今日概览 -->
        <div class="home-stats" id="homeStats"></div>

        <!-- 今日待打卡 -->
        <div class="block">
          <div class="block-title">今日待打卡</div>
          <div class="subject-grid" id="homeSubjects"></div>
        </div>

        <!-- 近期任务 -->
        <div class="block">
          <div class="block-title">近期任务</div>
          <div class="task-list" id="homeTasks"></div>
        </div>

        <!-- 最新积分 -->
        <div class="block">
          <div class="block-title">最新积分</div>
          <div class="flow-list" id="homeFlows"></div>
        </div>
      </section>

      <!-- 打卡 -->
      <section class="view" id="view-checkin">
        <div class="block">
          <div class="block-title">选择科目打卡</div>
          <div class="subject-grid" id="checkinSubjects"></div>
        </div>
        <div class="block">
          <div class="block-head">
            <div class="block-title">今日打卡记录</div>
            <span class="block-hint" id="todayCount">0 次</span>
          </div>
          <div class="checkin-list" id="checkinToday"></div>
        </div>
      </section>

      <!-- 任务 -->
      <section class="view" id="view-tasks">
        <div class="block">
          <div class="block-head">
            <div class="block-title">学习科目</div>
            <button class="mini-btn" id="addSubjectBtn">＋ 科目</button>
          </div>
          <div class="subject-manage" id="subjectManage"></div>
        </div>
        <div class="block">
          <div class="block-head">
            <div class="block-title">学习任务</div>
            <select class="mini-select" id="taskFilter"></select>
          </div>
          <div class="task-list" id="taskList"></div>
        </div>
      </section>

      <!-- 倒数日 -->
      <section class="view" id="view-countdown">
        <div class="block">
          <div class="block-head">
            <div class="block-title">倒数日</div>
            <button class="mini-btn" id="addCountdownBtn">＋ 新增</button>
          </div>
          <div class="countdown-list" id="countdownList"></div>
        </div>
      </section>

      <!-- 我的 -->
      <section class="view" id="view-me">
        <div class="block">
          <div class="block-head">
            <div class="block-title"><svg class="ico block-title-ico" aria-hidden="true"><use href="#icon-gift"/></svg>积分兑换</div>
            <button class="mini-btn" id="addGiftBtn">＋ 礼品</button>
          </div>
          <div class="gift-list" id="giftList"></div>
        </div>
        <div class="block">
          <div class="block-head">
            <div class="block-title">打卡历史</div>
            <select class="mini-select" id="historyFilter"></select>
          </div>
          <div class="history-list" id="historyList"></div>
        </div>
        <div class="block">
          <div class="block-title">积分流水</div>
          <div class="flow-list" id="flowList"></div>
        </div>
        <div class="block">
          <button class="danger-btn" id="resetBtn">清空所有数据</button>
        </div>
      </section>

      <!-- 番茄钟（专注） -->
      <section class="view" id="view-focus">
        <div class="focus-wrap">
          <div class="focus-modes">
            <button class="mode-btn active" data-mode="focus"><svg class="ico" aria-hidden="true"><use href="#icon-clock"/></svg>专注</button>
            <button class="mode-btn" data-mode="short"><svg class="ico" aria-hidden="true"><use href="#icon-coffee"/></svg>短休</button>
            <button class="mode-btn" data-mode="long"><svg class="ico" aria-hidden="true"><use href="#icon-moon"/></svg>长休</button>
          </div>
          <div class="focus-ring">
            <svg viewBox="0 0 220 220" aria-hidden="true">
              <defs>
                <linearGradient id="fgGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#6366f1"/>
                  <stop offset="100%" stop-color="#22d3ee"/>
                </linearGradient>
              </defs>
              <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
              <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="100" stroke="url(#fgGrad)"></circle>
            </svg>
            <div class="focus-center">
              <div class="focus-emoji" id="focusEmoji"><svg class="ico focus-big-ico" aria-hidden="true"><use href="#icon-clock"/></svg></div>
              <div class="focus-time" id="focusTime">25:00</div>
              <div class="focus-tip" id="focusTip">开始专注吧～</div>
            </div>
          </div>
          <div class="focus-ctrl">
            <button class="focus-btn ghost" id="focusReset" aria-label="重置">↺</button>
            <button class="focus-btn primary" id="focusToggle">开始</button>
          </div>
          <div class="focus-stats">
            <div class="fstat"><svg class="ico fstat-ico" aria-hidden="true"><use href="#icon-clock"/></svg><b id="focusToday">0</b><small>今日</small></div>
            <div class="fstat"><svg class="ico fstat-ico" aria-hidden="true"><use href="#icon-trophy"/></svg><b id="focusTotal">0</b><small>累计</small></div>
          </div>
        </div>
      </section>
    </main>

    <!-- 悬浮按钮 -->
    <button class="fab" id="fab" aria-label="快捷操作"><svg class="ico fab-ico" aria-hidden="true"><use href="#icon-plus"/></svg></button>

    <!-- 底部导航 -->
    <nav class="bottom-nav" id="bottomNav">
      <span class="nav-glow" aria-hidden="true"></span>
      <span class="nav-sheen" aria-hidden="true"></span>
      <button class="nav-btn active" data-view="home"><svg class="nav-ico" aria-hidden="true"><use href="#icon-home"/></svg><span>首页</span></button>
      <button class="nav-btn" data-view="checkin"><svg class="nav-ico" aria-hidden="true"><use href="#icon-check-circle"/></svg><span>打卡</span></button>
      <button class="nav-btn" data-view="tasks"><svg class="nav-ico" aria-hidden="true"><use href="#icon-kanban"/></svg><span>任务</span></button>
      <button class="nav-btn" data-view="countdown"><svg class="nav-ico" aria-hidden="true"><use href="#icon-calendar"/></svg><span>倒数</span></button>
      <button class="nav-btn" data-view="focus"><svg class="nav-ico" aria-hidden="true"><use href="#icon-clock"/></svg><span>专注</span></button>
      <button class="nav-btn" data-view="me"><svg class="nav-ico" aria-hidden="true"><use href="#icon-user"/></svg><span>我的</span></button>
    </nav>

    <!-- 底部弹层 -->
    <div class="sheet-mask" id="sheetMask">
      <div class="sheet" id="sheet" role="dialog" aria-modal="true">
        <div class="sheet-head">
          <div class="sheet-title" id="sheetTitle">标题</div>
          <button class="sheet-close" id="sheetClose" aria-label="关闭"><svg class="ico" aria-hidden="true"><use href="#icon-x"/></svg></button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <!-- 确认弹层 -->
    <div class="modal-mask" id="confirmMask">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-title" id="confirmTitle">提示</div>
        <div class="modal-msg" id="confirmMsg"></div>
        <div class="modal-actions">
          <button class="modal-btn ghost" id="confirmCancel">取消</button>
          <button class="modal-btn danger" id="confirmOk">确定</button>
        </div>
      </div>
    </div>

    <!-- 轻提示 -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
