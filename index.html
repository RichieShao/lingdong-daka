<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f8df7" />
  <title>灵动打卡 · 学习激励小助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 内联 SVG 图标库（线条风 Icon System · 24×24 · 1.8px 圆角描边 · currentColor） -->
    <svg style="display:none" aria-hidden="true">
      <defs>
        <!-- 通用 / 导航图标（线条风 · 24×24 · 1.8px 圆角描边 · currentColor） -->
        <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.4 10.2V19a1 1 0 0 0 1 1h11.2a1 1 0 0 0 1-1v-8.8"/><path d="M10 20v-5.6h4V20"/></symbol>
        <symbol id="icon-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.2 11 14.9l4.7-4.8"/></symbol>
        <symbol id="icon-kanban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="4" height="14" rx="1.4"/><rect x="10" y="5" width="4" height="10" rx="1.4"/><rect x="16.5" y="5" width="4" height="12" rx="1.4"/></symbol>
        <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.2"/><path d="M3.5 9.6h17"/><path d="M8 3.2v3.2M16 3.2v3.2"/><circle cx="12" cy="14.6" r="1.35"/></symbol>
        <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.4V12l3.2 2.1"/></symbol>
        <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.6"/><path d="M5.4 19.2a6.6 6.6 0 0 1 13.2 0"/></symbol>
        <symbol id="icon-camera" viewBox="0 0 24 24" fill="currentColor"><path d="M9 4h6l1.2 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2.8L9 4Zm3 4.5A3.5 3.5 0 1 0 15.5 12 3.5 3.5 0 0 0 12 8.5Z"/></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 12.4 9.5 17.4 19.4 6.6"/></symbol>
        <symbol id="icon-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 9.5l5.4-.8z"/></symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5.2A1.2 1.2 0 0 1 10.2 4h3.6A1.2 1.2 0 0 1 15 5.2V7"/><path d="M6 7v11.5a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5V7"/><path d="M10 11v6M14 11v6"/></symbol>
        <symbol id="icon-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-3.5L15.5 5a1.7 1.7 0 0 1 2.4 0l1.1 1.1a1.7 1.7 0 0 1 0 2.4L7.5 20z"/><path d="M13.8 6.6 17.4 10.2"/></symbol>
        <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></symbol>
        <symbol id="icon-gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="9.5" rx="1.6"/><path d="M3.6 10.5h16.8"/><path d="M12 10.5V20"/><path d="M12 8.3c-2.6-2-5 0-2.2 2.2M12 8.3c2.6-2 5 0 2.2 2.2"/></symbol>
        <symbol id="icon-book-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.6C9 4.3 5 4.7 3 5.7v12.8c2-.9 6-.6 9 1.1"/><path d="M12 5.6C15 4.3 19 4.7 21 5.7v12.8c-2-.9-6-.6-9 1.1"/></symbol>
        <symbol id="icon-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
        <symbol id="icon-arrow-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
        <symbol id="icon-coffee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9.5h12v4.5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"/><path d="M17 11h2.2a2.3 2.3 0 0 1 0 4.6H17"/><path d="M9 3.2c-1 1.4.8 2.2 0 3.6M12.5 3.2c-1 1.4.8 2.2 0 3.6"/></symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A8 8 0 1 1 9.8 4a6.2 6.2 0 0 0 10.2 10.2z"/></symbol>
        <symbol id="icon-ticket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6.5" width="17" height="11" rx="2.2"/><path d="M14 6.5v11" stroke-dasharray="2 2.4"/><circle cx="14" cy="6.5" r="1.05" fill="currentColor" stroke="none"/><circle cx="14" cy="17.5" r="1.05" fill="currentColor" stroke="none"/></symbol>
        <symbol id="icon-cookie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="14.2" cy="9" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="9.5" cy="15" r="1" fill="currentColor" stroke="none"/></symbol>
        <symbol id="icon-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.6 2.4 4 5.6 4 8.5s-1.4 6.1-4 8.5c-2.6-2.4-4-5.6-4-8.5s1.4-6.1 4-8.5z"/></symbol>
        <symbol id="icon-calculator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2.2"/><rect x="7.5" y="6" width="9" height="3.5" rx="1"/><path d="M8 12.6h.01M12 12.6h.01M16 12.6h.01M8 16h.01M12 16h.01M16 16h.01" stroke-linecap="round"/></symbol>
        <symbol id="icon-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="16.5" r="2.4"/><circle cx="17" cy="14.5" r="2.4"/><path d="M9.4 16.5V7l10-2v9"/></symbol>
        <symbol id="icon-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4.5h10v4.5a5 5 0 0 1-10 0z"/><path d="M5.5 5H4a2 2 0 0 0 2 3.5M18.5 5H20a2 2 0 0 1-2 3.5"/><path d="M10 14.5h4V17h3.5v2.5H6.5V17h3.5z"/></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
        <symbol id="icon-list-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4 6.5l1.3 1.3 2-2M4 12l1.3 1.3 2-2M4 17.5l1.3 1.3 2-2"/></symbol>
        <symbol id="icon-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></symbol>
        <symbol id="icon-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c2.5 3 4.5 5 4.5 8.2a4.5 4.5 0 0 1-9 0c0-1.4.6-2.5 1.5-3.4.2 1 .9 1.7 1.8 1.9-.6-1.6.1-3.6 1.2-4.7z"/></symbol>
        <symbol id="icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 0 1 12 0c0 4 1.2 5.4 1.8 6H4.2c.6-.6 1.8-2 1.8-6z"/><path d="M9.8 19a2.2 2.2 0 0 0 4.4 0"/></symbol>
        <!-- 科目图标（实心 currentColor 风，与线上统一） -->
        <symbol id="icon-subject-chinese" viewBox="0 0 24 24" fill="currentColor"><g transform="rotate(12 12 12)"><rect x="10.4" y="4.3" width="3.2" height="9.3" rx="1.6"/><path d="M10.3 13.6C9.6 15.8 9.7 18.4 11.6 21.5 13.9 18 14.1 15.9 13.7 13.6Z"/><circle cx="11.7" cy="21.4" r="1"/></g></symbol>
        <symbol id="icon-subject-math" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="3.6" r="1.7"/><path d="M11.2 5.2 7.8 19.3l1.4.5L12.4 6Z"/><path d="M12.8 5.2 16.2 19.3l-1.4.5L11.6 6Z"/></symbol>
        <symbol id="icon-subject-english" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.6 5 4.3 20"/><path d="M7.6 5 11 20"/><path d="M5.5 13.4h4.2"/><circle cx="16.2" cy="13.8" r="3.6"/><path d="M19.6 10.6v8.4c0 1-.8 1.6-1.7 1.3"/></symbol>
        <symbol id="icon-subject-politics" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h1.6v18H5ZM6.6 4h11c.5 0 .8.4.6.9l-1.5 3 1.5 3c.2.5-.1.9-.6.9h-11Z"/></symbol>
        <symbol id="icon-subject-history" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h14v2.4H5Z"/><path d="M5 18.6h14V21H5Z"/><path d="M6.5 5.4 17.5 5.4 12 12 17.5 18.6 6.5 18.6 12 12Z"/><path d="M10.6 12.6h2.8L12 16.8Z"/></symbol>
        <symbol id="icon-subject-geo" viewBox="0 0 24 24" fill="currentColor"><path d="M17 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5ZM3 19 8 11l3 4 4-6 6 10Z"/></symbol>
        <symbol id="icon-subject-physics" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(120 12 12)"/></symbol>
        <symbol id="icon-subject-chem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M10 3h4M10 3v6L6.4 17.6A2 2 0 0 0 8.2 20.4h7.6a2 2 0 0 0 1.8-2.8L14 9V3"/><path d="M7.4 14.6h9.2l-1 3.1a1.8 1.8 0 0 1-1.7 1.2H10.1a1.8 1.8 0 0 1-1.7-1.2Z" fill="currentColor" stroke="none"/></symbol>
      </defs>
    </svg>

    <!-- 顶部栏 -->
    <header class="app-header">
      <div class="search-bar">
        <svg class="ico search-ico" aria-hidden="true"><use href="#icon-search"/></svg>
        <input class="search-input" id="searchInput" placeholder="搜索科目、任务、目标…" />
        <button class="search-go" id="searchGo">搜索</button>
      </div>
      <div class="header-row">
        <div class="header-profile">
          <div class="hp-avatar" id="hpAvatar"><svg class="ico" aria-hidden="true"><use href="#icon-camera"/></svg></div>
          <input type="file" id="avatarInput" accept="image/*" hidden>
          <div class="hp-info">
            <div class="hp-greet-row">
              <span class="greet-title" id="greetTitle">早上好，同学</span>
              <button class="hp-edit" id="hpEdit">改名</button>
            </div>
            <div class="greet-sub" id="greetSub">今天也要元气满满地打卡哦</div>
            <div class="hp-meta" id="hpMeta">今日 0/0 · 连续 0 天</div>
          </div>
        </div>
        <div class="points-pill" id="pointsPill" title="积分余额">
          <svg class="ico ico-star" aria-hidden="true"><use href="#icon-star"/></svg><span id="pointsBalance">0</span>
        </div>
      </div>
    </header>

    <!-- 视图区 -->
    <main class="views">
      <!-- 首页 -->
      <section class="view view-home active" id="view-home">
        <!-- 今日概览 -->
        <div class="home-stats" id="homeStats"></div>

        <!-- 今日待打卡 -->
        <div class="block">
          <div class="block-title">今日待打卡</div>
          <div class="subject-grid" id="homeSubjects"></div>
        </div>

        <!-- 近期任务 -->
        <div class="block">
          <div class="block-title">近期任务</div>
          <div class="task-list" id="homeTasks"></div>
        </div>

        <!-- 最新积分 -->
        <div class="block">
          <div class="block-title">最新积分</div>
          <div class="flow-list" id="homeFlows"></div>
        </div>
      </section>

      <!-- 打卡 -->
      <section class="view" id="view-checkin">
        <div class="block">
          <div class="block-title">选择科目打卡</div>
          <div class="subject-grid" id="checkinSubjects"></div>
        </div>
        <div class="block">
          <div class="block-head">
            <div class="block-title">今日打卡记录</div>
            <span class="block-hint" id="todayCount">0 次</span>
          </div>
          <div class="checkin-list" id="checkinToday"></div>
        </div>
      </section>

      <!-- 任务 -->
      <section class="view" id="view-tasks">
        <div class="block">
          <div class="block-head">
            <div class="block-title">学习科目</div>
            <button class="mini-btn" id="addSubjectBtn">＋ 科目</button>
          </div>
          <div class="subject-manage" id="subjectManage"></div>
        </div>
        <div class="block">
          <div class="block-head">
            <div class="block-title">学习任务</div>
            <select class="mini-select" id="taskFilter"></select>
          </div>
          <div class="task-list" id="taskList"></div>
        </div>
      </section>

      <!-- 倒数日 -->
      <section class="view" id="view-countdown">
        <div class="block">
          <div class="block-head">
            <div class="block-title">倒数日</div>
            <button class="mini-btn" id="addCountdownBtn">＋ 新增</button>
          </div>
          <div class="countdown-list" id="countdownList"></div>
        </div>
      </section>

      <!-- 我的 -->
      <section class="view" id="view-me">
        <!-- 数据备份 -->
        <div class="block sync-card" id="syncCard">
          <div class="block-head">
            <div class="block-title"><svg class="ico block-title-ico" aria-hidden="true"><use href="#icon-arrow-down"/></svg>数据备份</div>
          </div>
          <div class="sync-meta sync-hint">免费 · 数据保存在本地，换手机时手动导一次（每次备份按日期时间区分）</div>
          <div class="sync-row backup-row">
            <button class="sync-btn" id="backupNow">立即备份</button>
            <button class="sync-btn ghost" id="backupImport">导入备份</button>
            <input type="file" id="backupFile" accept="application/json,.json" hidden />
          </div>
          <div class="sync-meta" id="backupMeta"></div>
          <button class="sync-btn ghost bh-open" id="backupHistoryBtn">历史记录</button>
        </div>

        <div class="block">
          <div class="block-head">
            <div class="block-title"><svg class="ico block-title-ico" aria-hidden="true"><use href="#icon-trophy"/></svg>成就</div>
          </div>
          <div class="achv-list" id="checkinAchv"></div>
        </div>
        <div class="block">
          <div class="block-head">
            <div class="block-title"><svg class="ico block-title-ico" aria-hidden="true"><use href="#icon-gift"/></svg>积分兑换</div>
            <button class="mini-btn" id="addGiftBtn">＋ 礼品</button>
          </div>
          <div class="gift-list" id="giftList"></div>
        </div>
        <div class="block">
          <div class="block-head">
            <div class="block-title">打卡历史</div>
            <select class="mini-select" id="historyFilter"></select>
          </div>
          <div class="history-list" id="historyList"></div>
        </div>
        <div class="block">
          <div class="block-title">积分流水</div>
          <div class="flow-list" id="flowList"></div>
        </div>
        <div class="block">
          <button class="danger-btn" id="resetBtn">清空所有数据</button>
        </div>
      </section>

      <!-- 番茄钟（专注） -->
      <section class="view" id="view-focus">
        <div class="focus-wrap">
          <!-- 走马灯（顶部 · 专注时抬头看时间，顺手脑补一下） -->
          <div class="marquee card-glass" id="marquee">
            <span class="marquee-badge" id="marqueeBadge">脑补</span>
            <div class="marquee-viewport">
              <div class="marquee-track" id="marqueeTrack"></div>
            </div>
          </div>
          <div class="focus-modes">
            <button class="mode-btn active" data-mode="focus"><svg class="ico" aria-hidden="true"><use href="#icon-clock"/></svg>专注</button>
            <button class="mode-btn" data-mode="short"><svg class="ico" aria-hidden="true"><use href="#icon-coffee"/></svg>短休</button>
            <button class="mode-btn" data-mode="long"><svg class="ico" aria-hidden="true"><use href="#icon-moon"/></svg>长休</button>
          </div>
          <div class="focus-ring">
            <svg viewBox="0 0 220 220" aria-hidden="true">
              <defs>
                <linearGradient id="fgGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#2f8df7"/>
                  <stop offset="100%" stop-color="#38bdf8"/>
                </linearGradient>
              </defs>
              <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
              <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="100" stroke="url(#fgGrad)"></circle>
            </svg>
            <div class="focus-center">
              <div class="focus-emoji" id="focusEmoji"><svg class="ico focus-big-ico" aria-hidden="true"><use href="#icon-clock"/></svg></div>
              <div class="focus-time" id="focusTime">25:00</div>
              <div class="focus-tip" id="focusTip">开始专注吧～</div>
            </div>
          </div>
      <div class="focus-ctrl">
        <button class="focus-btn primary magnetic" id="focusToggle">开始</button>
        <button class="focus-btn ghost" id="focusReset" aria-label="重置"><svg class="ico" aria-hidden="true"><use href="#icon-refresh"/></svg></button>
      </div>
          <div class="focus-stats">
            <div class="fstat"><svg class="ico fstat-ico" aria-hidden="true"><use href="#icon-clock"/></svg><b id="focusToday">0</b><small>今日</small></div>
            <div class="fstat"><svg class="ico fstat-ico" aria-hidden="true"><use href="#icon-star"/></svg><b id="focusTotal">0</b><small>累计</small></div>
          </div>
        </div>
      </section>
    </main>

    <!-- 悬浮按钮 -->
    <button class="fab magnetic" id="fab" aria-label="快捷操作"><svg class="ico fab-ico" aria-hidden="true"><use href="#icon-plus"/></svg></button>

    <!-- 底部导航 -->
    <nav class="bottom-nav" id="bottomNav">
      <span class="nav-glow" aria-hidden="true"></span>
      <span class="nav-sheen" aria-hidden="true"></span>
      <button class="nav-btn active" data-view="home"><svg class="nav-ico" aria-hidden="true"><use href="#icon-home"/></svg><span>首页</span></button>
      <button class="nav-btn" data-view="checkin"><svg class="nav-ico" aria-hidden="true"><use href="#icon-check-circle"/></svg><span>打卡</span></button>
      <button class="nav-btn" data-view="tasks"><svg class="nav-ico" aria-hidden="true"><use href="#icon-kanban"/></svg><span>任务</span></button>
      <button class="nav-btn" data-view="countdown"><svg class="nav-ico" aria-hidden="true"><use href="#icon-calendar"/></svg><span>倒数</span></button>
      <button class="nav-btn" data-view="focus"><svg class="nav-ico" aria-hidden="true"><use href="#icon-clock"/></svg><span>专注</span></button>
      <button class="nav-btn" data-view="me"><svg class="nav-ico" aria-hidden="true"><use href="#icon-user"/></svg><span>我的</span></button>
    </nav>

    <!-- 底部弹层 -->
    <div class="sheet-mask" id="sheetMask">
      <div class="sheet" id="sheet" role="dialog" aria-modal="true">
        <div class="sheet-head">
          <div class="sheet-title" id="sheetTitle">标题</div>
          <button class="sheet-close" id="sheetClose" aria-label="关闭"><svg class="ico" aria-hidden="true"><use href="#icon-x"/></svg></button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <!-- 确认弹层 -->
    <div class="modal-mask" id="confirmMask">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-title" id="confirmTitle">提示</div>
        <div class="modal-msg" id="confirmMsg"></div>
        <div class="modal-actions">
          <button class="modal-btn ghost" id="confirmCancel">取消</button>
          <button class="modal-btn danger" id="confirmOk">确定</button>
        </div>
      </div>
    </div>

    <!-- 搜索结果浮层 -->
    <div class="modal-mask search-sheet" id="searchSheet">
      <div class="search-panel" role="dialog" aria-modal="true">
        <div class="search-panel-head">
          <span>搜索结果</span>
          <button class="search-close" id="searchClose" aria-label="关闭"><svg class="ico" aria-hidden="true"><use href="#icon-x"/></svg></button>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>

    <!-- 轻提示 -->
    <div class="toast" id="toast"></div>
  </div>

  <!-- 酷炫开始页（启动封面，覆盖全屏） -->
  <div class="intro" id="intro">
    <div class="intro-orbs" aria-hidden="true">
      <span class="intro-orb o1"></span>
      <span class="intro-orb o2"></span>
      <span class="intro-orb o3"></span>
    </div>
    <div class="intro-inner">
      <div class="intro-logo"><svg class="ico" aria-hidden="true"><use href="#icon-check-circle"/></svg></div>
      <h1 class="intro-title">灵动打卡</h1>
      <p class="intro-slogan">每天进步一点点</p>
      <div class="intro-enter-wrap">
        <button class="intro-enter magnetic" id="introEnter">立即开启</button>
      </div>
      <p class="intro-tip">专注 · 打卡 · 成长</p>
    </div>
  </div>

  <!-- CloudBase Web SDK 由 script.js 通过 jsDelivr +esm 动态加载（不再依赖失效的 UMD CDN） -->
  <script src="script.js"></script>
</body>
</html>
