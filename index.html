<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <title>灵动打卡 · 学习激励小助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 内联 SVG 图标库（HarmonyOS / iOS 风格填充图标） -->
    <svg style="display:none" aria-hidden="true">
      <defs>
        <symbol id="icon-home" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></symbol>
        <symbol id="icon-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M16.3 9.3l-5.6 5.6-2.6-2.6 1.4-1.4 1.2 1.2 4.2-4.2z" fill="#fff"/></symbol>
        <symbol id="icon-list-check" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm2 4h2v2H7zm0 4h2v2H7zm0 4h2v2H7zm4-8h6v2h-6zm0 4h6v2h-6zm0 4h6v2h-6z"/></symbol>
        <symbol id="icon-calendar" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h2v2h6V2h2v2h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3zM4 9h16v11H4z"/></symbol>
        <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 7v5.3l3.5 2.1.9-1.5-2.9-1.7V7z" fill="#fff"/></symbol>
        <symbol id="icon-user" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-6 8a6 6 0 0 1 12 0z"/></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></symbol>
        <symbol id="icon-star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-.01z"/></symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zm9-11v8h-2V8zm-4 0v8H9V8zm8-4h-3l-1-1H9L8 4H5v2h14z"/></symbol>
        <symbol id="icon-pencil" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></symbol>
        <symbol id="icon-x" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
        <symbol id="icon-gift" viewBox="0 0 24 24" fill="currentColor"><path d="M20 7h-1.5A2.5 2.5 0 0 0 16 4.5c-1.1 0-2 .7-2.5 1.5h-3C9.9 5.2 9 4.5 8 4.5A2.5 2.5 0 0 0 5.5 7H4a2 2 0 0 0-2 2v2h20V9a2 2 0 0 0-2-2zM2 13h9v9H4a2 2 0 0 1-2-2v-7zm11 0h9v7a2 2 0 0 1-2 2h-7v-9z"/></symbol>
        <symbol id="icon-book-open" viewBox="0 0 24 24" fill="currentColor"><path d="M21 5c-1.1 0-2.6.4-3.5 1.1-.9-.7-2.4-1.1-3.5-1.1V18c1.1 0 2.6-.4 3.5-1.1.9.7 2.4 1.1 3.5 1.1zm-9 0c-1.1 0-2.6.4-3.5 1.1C7.6 5.4 6.1 5 5 5v13c1.1 0 2.6.4 3.5 1.1.9-.7 2.4-1.1 3.5-1.1z"/></symbol>
        <symbol id="icon-arrow-up" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-8 8h5v8h6v-8h5z"/></symbol>
        <symbol id="icon-arrow-down" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20l8-8h-5V4h-6v8H4z"/></symbol>
        <symbol id="icon-coffee" viewBox="0 0 24 24" fill="currentColor"><path d="M2 8h14v4a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5zm15 0h2a3 3 0 0 1 0 6h-2z"/></symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
        <symbol id="icon-ticket" viewBox="0 0 24 24" fill="currentColor"><path d="M3 7v2a2 2 0 0 1 0 4v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2a2 2 0 0 1 0-4V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2zm11-2h2v14h-2z"/></symbol>
        <symbol id="icon-cookie" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><circle cx="8" cy="10" r="1.5" fill="#fff"/><circle cx="15" cy="8" r="1.5" fill="#fff"/><circle cx="14" cy="15" r="1.5" fill="#fff"/><circle cx="9" cy="16" r="1.5" fill="#fff"/></symbol>
        <symbol id="icon-globe" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h3c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></symbol>
        <symbol id="icon-calculator" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm2 4h8v2H8zm0 4h2v2H8zm0 4h2v2H8zm0 4h2v2H8zm4-4h2v2h-2zm0 4h2v2h-2zm4-4h2v2h-2zm0 4h2v2h-2z"/></symbol>
        <symbol id="icon-music" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55a4 4 0 1 0 2 3.45V6h4V3h-6z"/></symbol>
        <symbol id="icon-trophy" viewBox="0 0 24 24" fill="currentColor"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.56 4.85 4 5.66V17h10v-3.34c2.44-.81 4-3.11 4-5.66V7c0-1.1-.9-2-2-2zm-4 14h-6v-2h6z"/></symbol>
        <symbol id="icon-kanban" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm6.5 3H18v10h-6.5zm-5.5 0h3.5v10H6z"/></symbol>
      </defs>
    </svg>

    <!-- 顶部栏 -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-logo">灵</span>
        <span class="brand-name">灵动打卡</span>
      </div>
      <div class="points-pill" id="pointsPill" title="积分余额">
        <svg class="ico ico-star" aria-hidden="true"><use href="#icon-star"/></svg><span id="pointsBalance">0</span>
      </div>
    </header>

    <!-- 视图区 -->
    <main class="views">
      <!-- 首页 -->
      <section class="view view-home active" id="view-home">
        <!-- 走马灯 -->
        <div class="marquee card-glass" id="marquee">
          <div class="marquee-head">
            <span class="marquee-subject" id="marqueeSubject">语文</span>
            <span class="marquee-tag" id="marqueeType">名言</span>
          </div>
          <div class="marquee-viewport">
            <div class="marquee-track" id="marqueeTrack"></div>
          </div>
          <div class="marquee-ctrl">
            <button class="marq-btn" id="marqPrev" aria-label="上一条">‹</button>
            <div class="marquee-dots" id="marqueeDots"></div>
            <button class="marq-btn" id="marqNext" aria-label="下一条">›</button>
          </div>
        </div>

        <!-- 今日概览 -->
        <div class="home-stats" id="homeStats"></div>

        <!-- 今日待打卡 -->
        <div class="block">
          <div class="block-title">今日待打卡</div>
          <div class="subject-grid" id="homeSubjects"></div>
        </div>

        <!-- 近期任务 -->
        <div class="block">
          <div class="block-title">近期任务</div>
          <div class="task-list" id="homeTasks"></div>
        </div>

        <!-- 最新积分 -->
        <div class="block">
          <div class="block-title">最新积分</div>
          <div class="flow-list" id="homeFlows"></div>
        </div>
      </section>

      <!-- 打卡 -->
      <section class="view" id="view-checkin">
        <div class="block">
          <div class="block-title">选择科目打卡</div>
          <div class="subject-grid" id="checkinSubjects"></div>
        </div>
        <div class="block">
          <div class="block-head">
            <div class="block-title">今日打卡记录</div>
            <span class="block-hint" id="todayCount">0 次</span>
          </div>
          <div class="checkin-list" id="checkinToday"></div>
        </div>
      </section>

      <!-- 任务 -->
      <section class="view" id="view-tasks">
        <div class="block">
          <div class="block-head">
            <div class="block-title">学习科目</div>
            <button class="mini-btn" id="addSubjectBtn">＋ 科目</button>
          </div>
          <div class="subject-manage" id="subjectManage"></div>
        </div>
        <div class="block">
          <div class="block-head">
            <div class="block-title">学习任务</div>
            <select class="mini-select" id="taskFilter"></select>
          </div>
          <div class="task-list" id="taskList"></div>
        </div>
      </section>

      <!-- 倒数日 -->
      <section class="view" id="view-countdown">
        <div class="block">
          <div class="block-head">
            <div class="block-title">倒数日</div>
            <button class="mini-btn" id="addCountdownBtn">＋ 新增</button>
          </div>
          <div class="countdown-list" id="countdownList"></div>
        </div>
      </section>

      <!-- 我的 -->
      <section class="view" id="view-me">
        <div class="block">
          <div class="block-head">
            <div class="block-title"><svg class="ico block-title-ico" aria-hidden="true"><use href="#icon-gift"/></svg>积分兑换</div>
            <button class="mini-btn" id="addGiftBtn">＋ 礼品</button>
          </div>
          <div class="gift-list" id="giftList"></div>
        </div>
        <div class="block">
          <div class="block-head">
            <div class="block-title">打卡历史</div>
            <select class="mini-select" id="historyFilter"></select>
          </div>
          <div class="history-list" id="historyList"></div>
        </div>
        <div class="block">
          <div class="block-title">积分流水</div>
          <div class="flow-list" id="flowList"></div>
        </div>
        <div class="block">
          <button class="danger-btn" id="resetBtn">清空所有数据</button>
        </div>
      </section>

      <!-- 番茄钟（专注） -->
      <section class="view" id="view-focus">
        <div class="focus-wrap">
          <div class="focus-modes">
            <button class="mode-btn active" data-mode="focus"><svg class="ico" aria-hidden="true"><use href="#icon-clock"/></svg>专注</button>
            <button class="mode-btn" data-mode="short"><svg class="ico" aria-hidden="true"><use href="#icon-coffee"/></svg>短休</button>
            <button class="mode-btn" data-mode="long"><svg class="ico" aria-hidden="true"><use href="#icon-moon"/></svg>长休</button>
          </div>
          <div class="focus-ring">
            <svg viewBox="0 0 220 220" aria-hidden="true">
              <defs>
                <linearGradient id="fgGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#6366f1"/>
                  <stop offset="100%" stop-color="#22d3ee"/>
                </linearGradient>
              </defs>
              <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
              <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="100" stroke="url(#fgGrad)"></circle>
            </svg>
            <div class="focus-center">
              <div class="focus-emoji" id="focusEmoji"><svg class="ico focus-big-ico" aria-hidden="true"><use href="#icon-clock"/></svg></div>
              <div class="focus-time" id="focusTime">25:00</div>
              <div class="focus-tip" id="focusTip">开始专注吧～</div>
            </div>
          </div>
          <div class="focus-ctrl">
            <button class="focus-btn ghost" id="focusReset" aria-label="重置">↺</button>
            <button class="focus-btn primary" id="focusToggle">开始</button>
          </div>
          <div class="focus-stats">
            <div class="fstat"><svg class="ico fstat-ico" aria-hidden="true"><use href="#icon-clock"/></svg><b id="focusToday">0</b><small>今日</small></div>
            <div class="fstat"><svg class="ico fstat-ico" aria-hidden="true"><use href="#icon-trophy"/></svg><b id="focusTotal">0</b><small>累计</small></div>
          </div>
        </div>
      </section>
    </main>

    <!-- 悬浮按钮 -->
    <button class="fab" id="fab" aria-label="快捷操作"><svg class="ico fab-ico" aria-hidden="true"><use href="#icon-plus"/></svg></button>

    <!-- 底部导航 -->
    <nav class="bottom-nav" id="bottomNav">
      <span class="nav-glow" aria-hidden="true"></span>
      <span class="nav-sheen" aria-hidden="true"></span>
      <button class="nav-btn active" data-view="home"><svg class="nav-ico" aria-hidden="true"><use href="#icon-home"/></svg><span>首页</span></button>
      <button class="nav-btn" data-view="checkin"><svg class="nav-ico" aria-hidden="true"><use href="#icon-check-circle"/></svg><span>打卡</span></button>
      <button class="nav-btn" data-view="tasks"><svg class="nav-ico" aria-hidden="true"><use href="#icon-kanban"/></svg><span>任务</span></button>
      <button class="nav-btn" data-view="countdown"><svg class="nav-ico" aria-hidden="true"><use href="#icon-calendar"/></svg><span>倒数</span></button>
      <button class="nav-btn" data-view="focus"><svg class="nav-ico" aria-hidden="true"><use href="#icon-clock"/></svg><span>专注</span></button>
      <button class="nav-btn" data-view="me"><svg class="nav-ico" aria-hidden="true"><use href="#icon-user"/></svg><span>我的</span></button>
    </nav>

    <!-- 底部弹层 -->
    <div class="sheet-mask" id="sheetMask">
      <div class="sheet" id="sheet" role="dialog" aria-modal="true">
        <div class="sheet-head">
          <div class="sheet-title" id="sheetTitle">标题</div>
          <button class="sheet-close" id="sheetClose" aria-label="关闭"><svg class="ico" aria-hidden="true"><use href="#icon-x"/></svg></button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <!-- 确认弹层 -->
    <div class="modal-mask" id="confirmMask">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-title" id="confirmTitle">提示</div>
        <div class="modal-msg" id="confirmMsg"></div>
        <div class="modal-actions">
          <button class="modal-btn ghost" id="confirmCancel">取消</button>
          <button class="modal-btn danger" id="confirmOk">确定</button>
        </div>
      </div>
    </div>

    <!-- 轻提示 -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
